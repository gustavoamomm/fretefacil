{% extends 'base.html' %}

{% block title %}Cadastro{% endblock %}

{% block content %}

<body class="pagina-cadastro revelar atraso-1">

    <section class="cadastro-escolha">
        <div class="escolha-container">
            <h2>Como deseja cadastrar?</h2>
            <div class="opcoes-cadastro">

                <a href="{{ url_for('cadastro_pcu') }}" class="opcao-card">
                    <div class="card-icon">
                        <img src="{{ url_for('static', filename='img/icons/driver-white.png') }}" alt="Motorista">
                    </div>
                    <div class="card-content">
                        <h3>Sou Proprietário de carro utilitário</h3>
                        <p>Aqui você encontra seus fretes.</p>
                    </div>
                    <div class="card-arrow">
                        &gt;
                    </div>
                </a>

                <a href="{{ url_for('cadastro_emp') }}" class="opcao-card">
                    <div class="card-icon">
                        <img src="{{ url_for('static', filename='img/icons/empresa-white.png') }}" alt="Empresa">
                    </div>
                    <div class="card-content">
                        <h3>Sou empresa</h3>
                        <p>Aqui você publica os seus fretes.</p>
                    </div>
                    <div class="card-arrow">
                        &gt;
                    </div>

                </a>
                </a>
            </div>
        </div>
    </section>
    </div>
</body>

{% endblock %}
