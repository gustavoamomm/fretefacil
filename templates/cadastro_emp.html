{% extends 'base.html' %}

{% block title %}Início{% endblock %}

{% block content %}

<body class="pagina-cadastro revelar atraso-1">

    <!-- 🔔 MENSAGENS FLASH PADRONIZADAS -->
    <div class="flash-wrapper" style="max-width: 500px; margin: 0 auto 20px auto;">
        {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
        <div class="flash-container">
            {% for category, message in messages %}
            <div class="flash-message {{ category }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
    </div>

    <section class="form-cadastro-login form-cadastro-pcu">

        <div class="avatar-icon">
            <img src="{{ url_for('static', filename='img/icons/user.png')}}" alt="empresa">
        </div>

        <h3>Cadastrar Como Empresa</h3>

        <form action="{{ url_for('cadastro_emp') }}" method="POST" class="form-cadastro-grid">

            <div class="campo full">
                <label>Nome da Empresa:</label>
                <div class="input-field-group">
                    <input type="text" name="nome" placeholder="Digite o nome da empresa" required>
                </div>
            </div>

            <div class="campo full">
                <label>CNPJ (14 dígitos):</label>
                <div class="input-field-group">
                    <input type="text" name="cnpj" maxlength="14" placeholder="Somente números" required>
                </div>
            </div>

            <div class="campo">
                <label>Senha (8 dígitos):</label>
                <div class="input-field-group">
                    <input type="password" name="senha" minlength="8" placeholder="Senha" required>
                </div>
            </div>

            <div class="campo">
                <label>Confirmar Senha:</label>
                <div class="input-field-group">
                    <input type="password" name="confirsenha" minlength="8" placeholder="Confirme a senha" required>
                </div>
            </div>

            <div class="botao-area full">
                <button type="submit" class="btn-cadastro-pcu">Cadastrar Empresa</button>
            </div>

        </form>
    </section>

</body>

{% endblock %}
