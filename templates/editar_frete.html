{% extends 'dashboard_empresa_base.html' %}

{% block title %}Editar Frete #{{ frete.id_frete }}{% endblock %}

{% block dashboard_content %}

<h2 style="color: #000; font-size: 2rem; margin-bottom: 20px;">
    Editar Frete #{{ frete.id_frete }}
</h2>

<div class="form-card">
    <form method="POST" class="form-publicar-frete">

        <div class="campo full">
            <label>Origem (Cidade/UF):</label>
            <input type="text" name="origem" value="{{ frete.origem }}" required>
        </div>

        <div class="campo full">
            <label>Destino (Cidade/UF):</label>
            <input type="text" name="destino" value="{{ frete.destino }}" required>
        </div>

        <div class="campo">
            <label>Valor Oferecido (R$):</label>
            <input type="text" name="valor" value="{{ frete.valor }}" placeholder="1200.00" required>
        </div>

        <div class="campo">
            <label>Carro Necessário:</label>
            <select name="carro">
                {% set carros = ['Van', 'Fiorino', 'HR', 'Caminhão 3/4', 'Outro'] %}
                {% for c in carros %}
                <option value="{{ c }}" {% if c==frete.carro_necessario %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="full">
            <button type="submit" class="btn-publicar-frete">SALVAR EDIÇÃO DO FRETE</button>
        </div>
    </form>
</div>

{% if frete.status == 'Pendente' %}
<!-- Botão Excluir -->
<form method="POST" action="{{ url_for('excluir_frete', frete_id=frete.id_frete) }}"
    onsubmit="return confirm('Tem certeza que deseja excluir este frete? Essa ação não pode ser desfeita.');">

    <button type="submit" class="btn-excluir">
        EXCLUIR FRETE
    </button>
</form>
{% endif %}


{% endblock %}
