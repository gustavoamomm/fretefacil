{% extends 'dashboard_empresa_base.html' %}

{% block title %}Publicar Frete{% endblock %}

{% block dashboard_content %}
<h3 style="margin-bottom: 25px; font-size: 1.5rem; color: #000;">Publicar Novo Frete</h3>

<div class="form-cadastro-pcu form-aba-carro"
    style="background:#0a0a0a; border-radius:12px; padding:30px; box-shadow:0 4px 10px rgba(0,0,0,0.4);">

    <div class="form-cadastro-grid">
        <form action="{{ url_for('publicar_frete')}}" method="POST" class="form-publicar-frete">

            <div class="campo full">
                <label for="origem">Origem (Endereço Completo ou Cidade/Estado):</label>
                <input type="text" id="origem" name="origem" placeholder="Ex: São Paulo, SP" required>
            </div>

            <div class="campo full">
                <label for="destino">Destino (Endereço Completo ou Cidade/Estado):</label>
                <input type="text" id="destino" name="destino" placeholder="Ex: Rio de Janeiro, RJ" required>
            </div>

            <div class="campo">
                <label for="valor">Valor do Frete (R$):</label>
                <input type="number" id="valor" name="valor" step="0.01" min="100" placeholder="Ex: 1250.00" required>
            </div>

            <div class="campo">
                <label for="carro">Tipo de Carro Utilitário Necessário:</label>
                <select id="carro" name="carro" required>
                    <option value="">Selecione...</option>
                    <option value="Fiorino">Fiorino / Van</option>
                    <option value="Baú">Baú Simples</option>
                    <option value="Refrigerado">Baú Refrigerado</option>
                    <option value="Caminhão">Caminhão de Pequeno Porte (3/4)</option>
                </select>
            </div>

            <div class="botao-area full">
                <button type="submit" class="btn-publicar-frete">PUBLICAR FRETE</button>
            </div>

        </form>
    </div>
    {% endblock %}
