<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/delivery-truck.png') }}">
    <script src="{{ url_for('static', filename='script.js')}}"></script>
    <title>{% block title %}Frete Fácil{% endblock %}</title>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <a href="{{ url_for('main') }}" class="logo" style="text-decoration: none; color: inherit;">
                <img src="{{ url_for('static', filename='img/delivery-truck.png') }}" alt="logo">
                <h1>Frete Fácil</h1>
            </a>
     
            <nav class="navbar">

                <a href="{{ url_for('login') }}" class="btn-login">Entrar</a>
                <a href="{{ url_for('cadastro') }}" class="btn-cadastro">Cadastrar</a>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
