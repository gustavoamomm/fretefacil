{% extends "dashboard_base_pcu.html" %}

{% block dashboard_content %}

<h2 class="titulo-meus-fretes revelar atraso-1">Registrar Carro</h2>

<div class="form-cadastro-pcu form-aba-carro revelar atraso-3"
     style="background:#000; border-radius:12px; padding:30px; box-shadow:0 4px 10px rgba(0,0,0,0.4);">

    <!-- FORM ajustado para enviar exatamente o que o Python espera -->
    <form action="{{ url_for('registrar_carro') }}" method="POST">

        <div class="form-cadastro-grid ">

            <!-- Modelo -->
            <div class="campo">
                <label for="modelo">Modelo</label>
                <div class="input-field-group">
                    <input type="text" id="modelo" name="modelo" placeholder="Ex: Fiorino" required>
                </div>
            </div>

            <!-- Placa -->
            <div class="campo">
                <label for="placa">Placa</label>
                <div class="input-field-group">
                    <input type="text" id="placa" name="placa" placeholder="XXX-0A00" required>
                </div>
            </div>

            <!-- Porte -->
            <div class="campo">
                <label for="porte">Porte</label>
                <div class="input-field-group">
                    <select id="porte" name="porte" required class="input-field-group">
                        <option value="">Selecione...</option>
                        <option value="Pequeno">Pequeno</option>
                        <option value="Médio">Médio</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>
            </div>

            <!-- Tipo de Carroceria -->
            <div class="campo">
                <label for="carroceria">Tipo de Carroceria</label>
                <div class="input-field-group">
                    <select id="carroceria" name="carroceria" required class="input-field-group">
                        <option value="">Selecione...</option>
                        <option value="Baú">Baú</option>
                        <option value="Aberta">Aberta</option>
                        <option value="Sider">Sider</option>
                        <option value="Furgão">Furgão</option>
                        <option value="Picape">Picape</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
            </div>

            <!-- Observações -->
            <div class="campo full">
                <label for="obs">Observações</label>
                <div class="input-field-group">
                    <input type="text" id="obs" name="obs" placeholder="Informações adicionais (opcional)">
                </div>
            </div>

        </div>

        <button type="submit" class="btn-cadastro-pcu">Registrar Carro</button>

    </form>

</div>

{% endblock dashboard_content %}
